<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio de Aprendizagem - Portfólio de Aprendizagem</title>
    <style>
        :root {
            --p-bg: #f6faf8;
            --p-card: #ffffff;
            --p-text: #1c1c1c;
            --p-muted: #5c6b64;
            --p-border: #d9e2de;
            --p-accent: #2e7d5b;
            --p-accent-strong: #245f46;
            --p-shadow: rgba(31, 63, 53, 0.12);
            --p-on-accent: #ffffff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --p-bg: #22272e;
                --p-card: #2d333b;
                --p-text: #e6edf3;
                --p-muted: #9aa7a0;
                --p-border: #3d444d;
                --p-accent: #7fc9a2;
                --p-accent-strong: #a5dcbe;
                --p-shadow: rgba(0, 0, 0, 0.4);
                --p-on-accent: #10251a;
            }
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: var(--p-text);
            background: var(--p-bg);
        }

        #content {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden;
        }

        .portfolio-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            overflow-x: hidden;
        }

        .portfolio-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .portfolio-header h1 {
            margin: 0 0 1rem 0;
            color: var(--p-accent);
            font-size: 2.5rem;
            font-weight: 700;
            word-wrap: break-word;
            overflow-wrap: break-word;
            hyphens: auto;
        }

        .portfolio-description {
            color: var(--p-muted);
            font-size: 1.1rem;
            max-width: 800px;
            margin: 1rem auto;
            line-height: 1.6;
            word-wrap: break-word;
            overflow-wrap: break-word;
            hyphens: auto;
        }

        .portfolio-tabs {
            margin-bottom: 2rem;
        }

        .tabs-header {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            border-bottom: 2px solid var(--p-border);
            padding-bottom: 1rem;
        }

        .tab-button {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border: 1px solid var(--p-border);
            background: var(--p-card);
            color: var(--p-text);
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            white-space: nowrap;
            position: relative;
            box-shadow: 0 1px 3px var(--p-shadow);
        }

        .tab-button:focus-visible {
            outline: 2px solid var(--p-accent);
            outline-offset: 2px;
        }

        .tab-date {
            color: var(--p-muted);
            font-size: 0.85rem;
        }

        .tab-author {
            font-weight: 500;
            color: var(--p-text);
        }

        .tab-button:hover {
            border-color: var(--p-accent);
            transform: translateY(-1px);
            box-shadow: 0 2px 6px var(--p-shadow);
        }

        .tab-button.active {
            background: var(--p-accent);
            border-color: var(--p-accent);
            color: var(--p-on-accent);
            box-shadow: 0 4px 12px var(--p-shadow);
        }

        .tab-button.active .tab-date {
            color: var(--p-on-accent);
            opacity: 0.85;
        }

        .tab-button.active .tab-author {
            color: var(--p-on-accent);
        }

        .tab-button.active::after {
            content: '';
            position: absolute;
            bottom: -1rem;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 10px solid var(--p-accent);
        }

        .portfolio-content {
            width: 100%;
            max-width: 100%;
            margin: 0;
            padding: 0;
            background: var(--p-card);
            border: 1px solid var(--p-border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 12px var(--p-shadow);
        }

        .portfolio-content iframe {
            width: 100%;
            height: 1200px;
            border: none;
            display: block;
            max-width: 100%;
            overflow-x: hidden;
        }

        @media (max-width: 768px) {
            .portfolio-container {
                padding: 1rem;
            }

            .portfolio-header h1 {
                font-size: 2rem;
            }

            .tabs-header {
                flex-direction: row;
                flex-wrap: nowrap;
                align-items: center;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                padding-bottom: 0.5rem;
                justify-content: flex-start;
            }

            .tab-button {
                flex-shrink: 0;
                padding: 0.5rem 1rem;
                font-size: 0.8rem;
            }

            .portfolio-content {
                border-radius: 8px;
            }

            .portfolio-content iframe {
                height: 800px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .tab-button,
            .tab-button:hover {
                transition: none;
                transform: none;
            }
        }
    </style>
</head>
<body>
    <main id="content">
        
<div class="portfolio-container">
    <div class="portfolio-header">
        <h1>Portfólio de Aprendizagem</h1>
        <p class="portfolio-description">Este portfólio documenta minha jornada de aprendizado durante o doutorado, na disciplina de Seminários I de 2025.</p>
    </div>

    <div class="portfolio-tabs">
        <div class="tabs-header">
            
            
            
            
                <button class="tab-button" onclick="showSeminario(event.currentTarget, 'https:\/\/hiurequeiroz.github.io\/pt\/doutorado\/seminarios\/tecnologias-esportes-wellness\/')">
                    <span class="tab-date">02/04</span>
                    <span class="tab-author">Arthur Gáspari</span>
                </button>
            
                <button class="tab-button" onclick="showSeminario(event.currentTarget, 'https:\/\/hiurequeiroz.github.io\/pt\/doutorado\/seminarios\/inovacao-acessibilidade\/')">
                    <span class="tab-date">09/04</span>
                    <span class="tab-author">Marcio Horta</span>
                </button>
            
                <button class="tab-button" onclick="showSeminario(event.currentTarget, 'https:\/\/hiurequeiroz.github.io\/pt\/doutorado\/seminarios\/desenvolvimento-edtech\/')">
                    <span class="tab-date">16/04</span>
                    <span class="tab-author">João Pedro Molina</span>
                </button>
            
                <button class="tab-button" onclick="showSeminario(event.currentTarget, 'https:\/\/hiurequeiroz.github.io\/pt\/doutorado\/seminarios\/pos-desenvolvimento-decrescimento\/')">
                    <span class="tab-date">23/04</span>
                    <span class="tab-author">Bárbara Bastos</span>
                </button>
            
                <button class="tab-button" onclick="showSeminario(event.currentTarget, 'https:\/\/hiurequeiroz.github.io\/pt\/doutorado\/seminarios\/algoritmos-racistas\/')">
                    <span class="tab-date">30/04</span>
                    <span class="tab-author">Adriana Marques</span>
                </button>
            
                <button class="tab-button" onclick="showSeminario(event.currentTarget, 'https:\/\/hiurequeiroz.github.io\/pt\/doutorado\/seminarios\/neuromodulacao-transcraniana\/')">
                    <span class="tab-date">07/05</span>
                    <span class="tab-author">Marcelo de Oliveira Fonseca</span>
                </button>
            
                <button class="tab-button" onclick="showSeminario(event.currentTarget, 'https:\/\/hiurequeiroz.github.io\/pt\/doutorado\/seminarios\/acessibilidade-digital\/')">
                    <span class="tab-date">14/05</span>
                    <span class="tab-author">Tiago Silva da Silva</span>
                </button>
            
                <button class="tab-button" onclick="showSeminario(event.currentTarget, 'https:\/\/hiurequeiroz.github.io\/pt\/doutorado\/seminarios\/avaliacao-do-ciclo-de-vida\/')">
                    <span class="tab-date">28/05</span>
                    <span class="tab-author">Guilherme Nogueira</span>
                </button>
            
                <button class="tab-button" onclick="showSeminario(event.currentTarget, 'https:\/\/hiurequeiroz.github.io\/pt\/doutorado\/seminarios\/dia-mundial-do-meio-ambiente\/')">
                    <span class="tab-date">04/06</span>
                    <span class="tab-author">Marina Dias</span>
                </button>
            
                <button class="tab-button" onclick="showSeminario(event.currentTarget, 'https:\/\/hiurequeiroz.github.io\/pt\/doutorado\/seminarios\/um-panorama-das-desigualdades-de-genero-no-mercado-de-trabalho-brasileiro\/')">
                    <span class="tab-date">11/06</span>
                    <span class="tab-author">Daniela Verzola Vaz</span>
                </button>
            
        </div>
    </div>

    <div class="portfolio-content">
        <iframe id="seminario-frame" title="Portfólio de Aprendizagem"></iframe>
    </div>
</div>

    </main>

    <script>
        function showSeminario(element, url) {
            
            document.querySelectorAll('.tab-button').forEach(button => {
                button.classList.remove('active');
            });

            
            element.classList.add('active');

            
            document.getElementById('seminario-frame').src = url;
        }

        
        document.addEventListener('DOMContentLoaded', () => {
            const firstButton = document.querySelector('.tab-button');
            if (firstButton) {
                firstButton.classList.add('active');
                const url = firstButton.getAttribute('onclick').match(/'([^']+)'/)[1];
                showSeminario(firstButton, url);
            }
        });
    </script>
</body>
</html>
